<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
       .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
       .toy {
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 10px 0;
            padding: 10px;
            background-color: #fff;
        }
       .toy img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>Toy Collection</h1>
    </header>
    <div class="container">
        <h1>Welcome to My Toy Collection</h1>
        <div class="toy">
            <h2>Teddy Bear</h2>
            <img src="https://example.com/teddy-bear.jpg" alt="Teddy Bear">
            <p>This is a description of the teddy bear.</p>
        </div>
        <div class="toy">
            <h2>Robot</h2>
            <img src="https://example.com/robot.jpg" alt="Robot">
            <p>This is a description of the robot.</p>
        </div>
        <div class="toy">
            <h2>Doll</h2>
            <img src="https://example.com/doll.jpg" alt="Doll">
            <p>This is a description of the doll.</p>
        </div>
    </div>
</body>
</html>
