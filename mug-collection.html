<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mug Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
      .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
      .mug {
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 10px 0;
            padding: 10px;
            background-color: #fff;
        }
      .mug img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mug Collection</h1>
    </header>
    <div class="container">
        <h1>Welcome to My Mug Collection</h1>
        <div class="mug">
            <h2>Coffee Mug</h2>
            <img src="https://example.com/coffee-mug.jpg" alt="Coffee Mug">
            <p>This is a description of the coffee mug.</p>
        </div>
        <div class="mug">
            <h2>Tea Mug</h2>
            <img src="https://example.com/tea-mug.jpg" alt="Tea Mug">
            <p>This is a description of the tea mug.</p>
        </div>
        <div class="mug">
            <h2>Travel Mug</h2>
            <img src="https://example.com/travel-mug.jpg" alt="Travel Mug">
            <p>This is a description of the travel mug.</p>
        </div>
    </div>
</body>
</html>
