<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painting Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .painting {
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 10px 0;
            padding: 10px;
            background-color: #fff;
        }
        .painting img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>Painting Collection</h1>
    </header>
    <div class="container">
        <h1>Welcome to My Painting Collection</h1>
        <div class="painting">
            <h2>Landscape Painting</h2>
            <img src="https://example.com/landscape-painting.jpg" alt="Landscape Painting">
            <p>This is a description of the landscape painting.</p>
        </div>
        <div class="painting">
            <h2>Portrait Painting</h2>
            <img src="https://example.com/portrait-painting.jpg" alt="Portrait Painting">
            <p>This is a description of the portrait painting.</p>
        </div>
        <div class="painting">
            <h2>Abstract Painting</h2>
            <img src="https://example.com/abstract-painting.jpg" alt="Abstract Painting">
            <p>This is a description of the abstract painting.</p>
        </div>
    </div>
</body>
</html>
